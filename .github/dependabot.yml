# Weekly dependency PRs, grouped to keep review load low. CI (pnpm check + browser E2E) is the gate.
# Actions are pinned to commit SHAs; Dependabot updates the SHA and the version comment together.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Reviewed on its own: run `pnpm db:check` and a trial `pnpm db:generate` (docs/decisions.md D-017).
      drizzle:
        patterns: ["drizzle-orm", "drizzle-kit"]
      # Cloudflare tooling moves together (wrangler, Vite plugin, vitest pool, workers types).
      cloudflare:
        patterns: ["wrangler", "@cloudflare/*"]
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
